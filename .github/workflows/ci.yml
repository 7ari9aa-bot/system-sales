name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    env:
      # CI is not production. `environment` defaults to "production" so that an
      # unset ENVIRONMENT fails closed instead of skipping the config checks
      # (review G-05), which means CI must opt out explicitly.
      ENVIRONMENT: local
      # Migrations and provisioning run as the admin role.
      DATABASE_URL_ADMIN: postgresql+asyncpg://postgres:postgres@localhost:5432/sales
      # Tests connect as `sales_app` — the SAME role production uses — because
      # `postgres` has rolbypassrls, which meant RLS was never enforced for the
      # test connection at all. That is how a FORCE-RLS production table was
      # written to by an unbound worker for its entire life without a red build.
      # provision.py creates this role and sets its password from
      # SALES_APP_DB_PASSWORD (otherwise it generates a random one).
      SALES_APP_DB_PASSWORD: ci-app-password
      DATABASE_URL_APP: postgresql+asyncpg://sales_app:ci-app-password@localhost:5432/sales
      DATABASE_URL_APP_ADMIN: postgresql+asyncpg://sales_app:ci-app-password@localhost:5432/sales
      # `DATABASE_URL` MUST be set here, and this is not belt-and-braces.
      #
      # `scripts/provision.py` writes a `.env` containing DATABASE_URL, and CI
      # runs provision.py. That file hardcodes the PRODUCTION Supabase pooler
      # host, so `settings.database_url` resolved to PRODUCTION for anything that
      # opens its own session rather than using the test connection — which is
      # exactly what `_revoke_family_on_reuse` and `record_security_event` do, by
      # design, so their writes survive a request rollback.
      #
      # The visible symptom was one red test:
      #   tests/test_auth_flow.py::test_refresh_token_reuse_revokes_family
      #   asyncpg.exceptions.InvalidPasswordError: password authentication failed
      #   for user "sales_app"
      # The password failing is the only reason nothing was written to
      # production. Environment variables outrank `.env` in pydantic-settings,
      # so setting it here pins every session to the CI database.
      DATABASE_URL: postgresql+asyncpg://sales_app:ci-app-password@localhost:5432/sales
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sales
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check app tests scripts
      - run: alembic upgrade head
      # Seeds roles/permissions/plans + applies RLS — tests rely on the seeded
      # roles and are skipped silently without a configured database otherwise.
      - run: python scripts/provision.py
      # -rs prints the reason for every skip. Without it a skip is invisible, and
      # a silently-skipped RLS test is indistinguishable from a passing one —
      # which is exactly how a FORCE-RLS production bug went unnoticed.
      - run: pytest -q -rs
      # Exercise the built frontend against this job's disposable PostgreSQL +
      # Redis and a real FastAPI process. The browser creates its own test user,
      # reads dashboard/orders, and logs out; no production data or credentials.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start API for the real-data browser flow
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/fihrist-api.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8000/readyz; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/fihrist-api.log
          exit 1
      - name: Build frontend bundle
        working-directory: frontend
        run: npm run build
      - name: Verify real registration, dashboard, orders, and logout in Chromium
        working-directory: frontend
        env:
          E2E_LIVE_API: "1"
        run: npx playwright test e2e/live-api.spec.js
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: live-api-playwright-results
          path: frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check:headers
      - run: npm run lint
      - run: npm run build

  # Browser tests against the production bundle. Split from `frontend` so a
  # failing spec does not obscure lint/build results, and so the two jobs run
  # in parallel.
  frontend-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Browser checks run against the built Vite app served by vite preview.
      - run: npm run build
      - run: npm run test:e2e
      # Traces/screenshots are captured on the first retry — keep them when the
      # run fails so a red build is debuggable without a re-run.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-test-results
          path: frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore
