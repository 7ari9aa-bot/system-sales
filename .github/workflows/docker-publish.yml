name: docker-publish

# §73: never publish an image for a commit whose CI did not pass.
#
# This used to trigger on `push: main` independently of `ci`, so a red commit
# still produced and published an image (observed on the media commit). It now
# runs only after `ci` completes, and the job refuses unless that run succeeded.
# `workflow_dispatch` is kept for a deliberate manual publish.
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: 7ari9aa-bot/sales-os-backend

jobs:
  build-and-push:
    # A manual run is always allowed; an automatic one must have a green CI.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # Under `workflow_run`, github.sha is the default branch HEAD, NOT the
      # commit CI just tested — the branch may have moved since. The revision
      # must come from the triggering run and be used for BOTH the checkout and
      # the tag, or the image would be built from one commit and tagged with
      # another.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
