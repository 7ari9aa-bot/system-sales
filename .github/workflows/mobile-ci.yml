name: mobile-ci

on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-gates:
    name: Flutter analyze & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify l10n generation
        run: flutter gen-l10n

      - name: Static Analysis
        run: flutter analyze --fatal-infos

      - name: Run Unit & Integration Tests
        run: flutter test

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Ensure Android SDK 36 Platform & Licenses
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" || true

      - name: Ensure Debug Keystore for CI Build
        run: |
          mkdir -p ~/.android ~/.config/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cp ~/.android/debug.keystore ~/.config/.android/debug.keystore

      - name: Build Android Release APK & AppBundle
        run: |
          flutter build apk --release
          flutter build appbundle --release

      - name: Upload Android Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fihrist-mobile-release-artifacts
          path: |
            mobile/build/app/outputs/flutter-apk/app-release.apk
            mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
