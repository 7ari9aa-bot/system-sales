# Production dependencies (installed from backend/ context)
[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sales-backend"
version = "0.1.0"
description = "Sales OS core API — FastAPI modular monolith"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.31",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "httpx>=0.27",
    "structlog>=24.1",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "orjson>=3.10",
    "pgvector>=0.3",
    "email-validator>=2.1",
    "boto3>=1.34",
]
