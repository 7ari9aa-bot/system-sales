[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sales-backend"
version = "0.1.0"
description = "Sales OS core API — FastAPI modular monolith"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    # <2.1: the 2.1 series changed async Result/session semantics — it broke
    # real-DB tests in CI the moment it floated in (coroutine-never-awaited in
    # the compiler, test fakes missing Result methods). Adopt deliberately:
    # audit the async paths, migrate the fakes, then raise this ceiling.
    "sqlalchemy[asyncio]>=2.0.31,<2.1",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "httpx>=0.27",
    "structlog>=24.1",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "orjson>=3.10",
    "pgvector>=0.3",
    "email-validator>=2.1",
    "boto3>=1.34",
    # §68: AES-256-GCM envelope encryption for secrets at rest
    # (app.core.secrets.EnvelopeSecretStore). Vetted AEAD — no hand-rolled crypto.
    "cryptography>=42",
    # zoneinfo needs a tz database: present on Linux/macOS images but NOT on
    # Windows, where every lookup raises ZoneInfoNotFoundError and the SLA
    # clock silently degrades to UTC. Pinning it here makes the behaviour
    # identical on every platform.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "fakeredis[lua]>=2.21",  # Lua script tests (sliding-window ratelimit) need lupa
    "pglast>=6.0",  # real PostgreSQL parser: validates generated migration SQL offline
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["migrations/versions"]  # autogenerated migrations keep their shape

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Header",
    "fastapi.Query",
    "fastapi.Body",
    "fastapi.Request",
    "app.modules.identity.deps.require_permission",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "gate: pre-production architecture gate scenarios",
]
