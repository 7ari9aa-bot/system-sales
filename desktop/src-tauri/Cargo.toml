[package]
name = "fihrist-desktop"
version = "0.2.0"
description = "Fihrist desktop shell (Tauri adapter layer)"
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
name = "fihrist_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.0", features = [] }

[dependencies]
tauri = { version = "=2.12.0", features = [] }
tauri-plugin-single-instance = "2"
url = "=2.5.8"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
log = { version = "=0.4.34", features = ["std"] }

# Exact versions, no caret: the same lockfile discipline the JS side uses, and
# `cargo update` is a deliberate act, not a side effect of a fresh clone.
# (`tauri-plugin-single-instance` carries a caret until its first CI run lands
# the lockfile; pin it to the locked version in the same commit as the lock.)

[lints.clippy]
# The denials are the ones that matter for this codebase: no panic paths in a
# shell that holds an open session. Style lints stay at their defaults so the
# gate that fails a build is a real defect, not a preference.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
